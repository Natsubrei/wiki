services:
  web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost}
    image: wiki
    ports:
      - "${PORT:-80}:80"
    environment:
      HOST: 0.0.0.0
      PORT: 80
      SITE_URL: ${SITE_URL:-http://localhost}
      POSTS_DIR: /app/content/posts
      TOOLS_DIR: /app/content/tools
    volumes:
      - ../wiki-content:/app/content
    restart: unless-stopped
